<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Pairs — Aurora Noir</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#05060a;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
.phone{width:390px;height:844px;border-radius:54px;position:relative;overflow:hidden;background:#000;box-shadow:0 40px 120px -20px #000,0 0 0 11px #14161e,0 0 0 13px #23262f}
.screen{position:absolute;inset:0;overflow:hidden;color:#eaf0ff;background:radial-gradient(120% 60% at 50% 120%,#0d1430,#05070f 70%)}
.screen::before{content:"";position:absolute;inset:-40% -10% 30%;z-index:0;filter:blur(70px);opacity:.7;
 background:radial-gradient(40% 40% at 25% 30%,#7a3cff,transparent),radial-gradient(45% 45% at 80% 20%,#00e0c0,transparent),radial-gradient(50% 40% at 60% 60%,#ff3d7f,transparent);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(40px) scale(1.15) rotate(8deg)}}
.screen>*{position:relative;z-index:2}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:5}
.status{display:flex;justify-content:space-between;padding:16px 30px 0;font-size:14px;font-weight:600}
.tag{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:#8ef;opacity:.9}
.hud{display:flex;align-items:center;gap:8px;padding:14px 18px 6px}
.panel{background:rgba(18,24,48,.55);border:1px solid rgba(140,170,255,.22);box-shadow:inset 0 0 18px rgba(120,150,255,.12),0 8px 24px -12px #000;backdrop-filter:blur(14px)}
.pill{padding:7px 12px;border-radius:13px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.scores{margin-left:auto}.scores i{width:9px;height:9px;border-radius:50%;display:inline-block}.scores .a{background:#2f8bff;box-shadow:0 0 8px #2f8bff}.scores .b{background:#ff5a3c;box-shadow:0 0 8px #ff5a3c}
.pause{width:38px;height:38px;justify-content:center;border-radius:50%;color:#9fe}
.partner{margin:8px 16px 0;padding:10px 14px 14px;border-radius:22px}
.ptag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#9fb0e0}
.pfan{display:flex;justify-content:center;margin-top:8px}.pfan .mini{margin-left:-12px}.pfan .mini:first-child{margin-left:0}
.mid{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
.opp{display:flex;flex-direction:column;align-items:center;gap:6px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#dfe7ff}
.opp.active .av{box-shadow:inset 0 0 16px rgba(120,150,255,.2),0 0 0 2px #6cf,0 0 30px #2f8bff}
.opp span{font-size:12px;font-weight:700;color:#9fb0e0}
.center{display:flex;flex-direction:column;align-items:center;gap:12px}
.colour{padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;color:#03110b;background:linear-gradient(180deg,#5be8b4,#27c08a);box-shadow:0 0 30px #27c08a,inset 0 1px 0 rgba(255,255,255,.6)}
.piles{display:flex;gap:16px;align-items:center}
.draw{width:60px;height:90px;border-radius:14px;display:grid;place-items:end center;padding-bottom:6px;font-weight:800;color:#bff;background:linear-gradient(160deg,#10204a,#0a1228);border:1px solid rgba(120,160,255,.45);box-shadow:0 0 22px rgba(80,120,255,.3),inset 0 1px 0 rgba(255,255,255,.2);position:relative}
.draw::before{content:"";position:absolute;inset:6px;border-radius:9px;border:1px solid rgba(140,180,255,.3)}
.prompt{margin:6px 18px 0;text-align:center;font-size:15px;line-height:1.35;padding:14px 18px;border-radius:18px;color:#eaf0ff}
.prompt b{color:#5be8b4}
.hand{position:absolute;bottom:30px;left:0;right:0;height:150px}
.card{border-radius:14px;position:relative;display:grid;place-items:center;font-weight:800;color:#fff;border:1px solid rgba(255,255,255,.25);box-shadow:0 16px 28px -14px #000,inset 0 1px 0 rgba(255,255,255,.4)}
.card .badge{background:#0b1020;border:1px solid currentColor;border-radius:30%;display:grid;place-items:center;font-weight:900}
.card .idx{position:absolute;top:7px;left:9px;font-size:13px}
.fire{background:linear-gradient(160deg,#3a1410,#1a0a08);color:#ff7a52}.rain{background:linear-gradient(160deg,#0c1b3a,#08122a);color:#5fb0ff}
.earth{background:linear-gradient(160deg,#0c2a20,#08160f);color:#5be8b4}.wind{background:linear-gradient(160deg,#2e240a,#161005);color:#ffd35a}
.wild{background:linear-gradient(160deg,#241546,#0e0824);color:#c9a6ff}
.wild .badge{background:conic-gradient(#ff5a3c,#2f8bff,#27c08a,#ffc83d,#ff5a3c);color:#fff;border:none}
.mini{width:34px;height:50px}.mini .badge{width:20px;height:20px;font-size:11px;border-radius:34%}
.big{width:78px;height:116px}.big .badge{width:48px;height:48px;font-size:30px}
.hand .card{width:84px;height:124px;position:absolute;bottom:0;left:50%;margin-left:-42px;transition:.3s}
.hand .badge{width:50px;height:50px;font-size:32px;border-radius:30%}
.h1{transform:rotate(-12deg) translateX(-108px)}.h2{transform:rotate(-7deg) translateX(-64px) translateY(8px)}
.h3{transform:rotate(-2deg) translateX(-20px)}.h4{transform:rotate(3deg) translateX(24px) translateY(8px)}
.h5{transform:rotate(8deg) translateX(68px)}.h6{transform:rotate(13deg) translateX(112px) translateY(10px)}
.play{bottom:24px;border-color:#9fe;box-shadow:0 0 0 2px #9fe,0 0 30px #00e0c0,0 20px 34px -14px #000}
</style></head><body><div class="phone"><div class="screen">
 <div class="island"></div>
 <div class="status"><span>9:41</span><span>Wild Pairs</span><span>100%</span></div>
 <div class="tag">02 · Aurora Noir</div>
 <div class="hud"><span class="pill round panel">Round 3</span><span class="pill scores panel"><i class="a"></i>Us 2&nbsp;&nbsp;<i class="b"></i>Them 1</span><span class="pill pause panel">❚❚</span></div>
 <div class="partner panel"><div class="ptag">Partner · 4 cards</div><div class="pfan">
   <div class="mini card fire"><span class="badge">7</span></div><div class="mini card earth"><span class="badge">3</span></div><div class="mini card rain"><span class="badge">9</span></div><div class="mini card wild"><span class="badge">★</span></div></div></div>
 <div class="mid">
   <div class="opp"><div class="av panel">L</div><span>4 cards</span></div>
   <div class="center"><div class="colour">◆ Earth</div><div class="piles"><div class="draw">42</div><div class="card earth big"><span class="idx">0</span><span class="badge">0</span></div></div></div>
   <div class="opp active"><div class="av panel">R</div><span>6 cards</span></div></div>
 <div class="prompt panel">Play an <b>Earth</b> card, a <b>0</b>, or a wild card</div>
 <div class="hand">
   <div class="card fire h1 play"><span class="idx">7</span><span class="badge">7</span></div>
   <div class="card rain h2"><span class="idx">↺</span><span class="badge" style="font-size:24px">↺</span></div>
   <div class="card earth h3 play"><span class="idx">0</span><span class="badge">0</span></div>
   <div class="card wind h4"><span class="idx">+2</span><span class="badge" style="font-size:22px">+2</span></div>
   <div class="card wild h5 play"><span class="idx">★</span><span class="badge" style="font-size:22px">✦</span></div>
   <div class="card fire h6"><span class="idx">9</span><span class="badge">9</span></div></div>
</div></div></body></html>
