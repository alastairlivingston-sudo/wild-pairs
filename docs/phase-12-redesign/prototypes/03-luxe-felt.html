<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Pairs — Luxe Felt</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#07120d;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
.phone{width:390px;height:844px;border-radius:54px;position:relative;overflow:hidden;background:#000;box-shadow:0 40px 120px -20px #000,0 0 0 11px #1a1510,0 0 0 13px #2e2417}
.screen{position:absolute;inset:0;overflow:hidden;color:#f4ecd7;
 background:radial-gradient(120% 80% at 50% 8%,#1d5c46,#0c3326 55%,#08231b)}
.screen::before{content:"";position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;
 background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px),repeating-linear-gradient(-45deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px)}
.screen::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(0,0,0,.6)}
.screen>*{position:relative;z-index:2}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:5}
.status{display:flex;justify-content:space-between;padding:16px 30px 0;font-size:14px;font-weight:600}
.tag{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:#e7c87f}
.gold{color:#1c1404;background:linear-gradient(180deg,#ffe9a8,#d9a94e 60%,#b8863a);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 4px rgba(120,70,10,.5),0 6px 16px -6px rgba(0,0,0,.6)}
.hud{display:flex;align-items:center;gap:8px;padding:14px 18px 6px}
.felt{background:rgba(6,40,28,.6);border:1px solid rgba(231,200,127,.35);box-shadow:inset 0 1px 0 rgba(231,200,127,.2),0 8px 22px -12px #000}
.pill{padding:7px 12px;border-radius:12px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.scores{margin-left:auto;color:#f0e3bf}.scores i{width:9px;height:9px;border-radius:50%;display:inline-block}.scores .a{background:#3fae86}.scores .b{background:#d9544a}
.pause{width:38px;height:38px;justify-content:center;border-radius:50%}
.partner{margin:8px 16px 0;padding:10px 14px 14px;border-radius:18px}
.ptag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#d9c79a}
.pfan{display:flex;justify-content:center;margin-top:8px}.pfan .mini{margin-left:-12px}.pfan .mini:first-child{margin-left:0}
.mid{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
.opp{display:flex;flex-direction:column;align-items:center;gap:6px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#f2e6c4}
.opp.active .av{box-shadow:0 0 0 2px #e7c87f,0 0 26px rgba(231,200,127,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.opp span{font-size:12px;font-weight:700;color:#cdbd92}
.center{display:flex;flex-direction:column;align-items:center;gap:12px}
.colour{padding:7px 16px;border-radius:999px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center}
.piles{display:flex;gap:16px;align-items:center}
.draw{width:60px;height:90px;border-radius:11px;display:grid;place-items:end center;padding-bottom:6px;font-weight:800;color:#f1e6c6;background:linear-gradient(160deg,#144634,#0a2c20);border:1.5px solid #c9a85e;box-shadow:0 12px 26px -10px #000,inset 0 0 0 3px rgba(201,168,94,.25);position:relative}
.prompt{margin:6px 18px 0;text-align:center;font-size:15px;line-height:1.35;padding:13px 18px;border-radius:16px;color:#f4ecd7}
.prompt b{color:#7ee0b4}
.hand{position:absolute;bottom:30px;left:0;right:0;height:150px}
.card{border-radius:12px;position:relative;display:grid;place-items:center;font-weight:800;color:#fff;border:1.5px solid #d8b86a;box-shadow:0 16px 26px -12px rgba(0,0,0,.75),inset 0 0 0 2px rgba(255,245,210,.25),inset 0 2px 0 rgba(255,255,255,.4)}
.card .badge{background:#fbf4df;border-radius:26%;display:grid;place-items:center;font-weight:900;box-shadow:inset 0 -2px 4px rgba(120,90,30,.25)}
.card .idx{position:absolute;top:7px;left:9px;font-size:13px;color:#fdf3d6}
.fire{background:linear-gradient(160deg,#e0613f,#a8341f)}.fire .badge{color:#a8341f}
.rain{background:linear-gradient(160deg,#3d77c2,#1c4c8c)}.rain .badge{color:#1c4c8c}
.earth{background:linear-gradient(160deg,#3a9a6d,#1b6a45)}.earth .badge{color:#1b6a45}
.wind{background:linear-gradient(160deg,#d8b24a,#a9842a)}.wind .badge{color:#7a5c12}
.wild{background:linear-gradient(160deg,#3a2b4e,#1c1430)}.wild .badge{background:conic-gradient(#e0613f,#3d77c2,#3a9a6d,#d8b24a,#e0613f);color:#fff}
.mini{width:34px;height:50px}.mini .badge{width:20px;height:20px;font-size:11px;border-radius:30%}
.big{width:78px;height:116px}.big .badge{width:48px;height:48px;font-size:30px}
.hand .card{width:84px;height:124px;position:absolute;bottom:0;left:50%;margin-left:-42px;transition:.3s}
.hand .badge{width:50px;height:50px;font-size:32px;border-radius:28%}
.h1{transform:rotate(-12deg) translateX(-108px)}.h2{transform:rotate(-7deg) translateX(-64px) translateY(8px)}
.h3{transform:rotate(-2deg) translateX(-20px)}.h4{transform:rotate(3deg) translateX(24px) translateY(8px)}
.h5{transform:rotate(8deg) translateX(68px)}.h6{transform:rotate(13deg) translateX(112px) translateY(10px)}
.play{bottom:24px;border-color:#ffe9a8;box-shadow:0 0 0 2px #ffe18a,0 0 28px rgba(255,210,110,.7),0 18px 30px -14px #000,inset 0 0 0 2px rgba(255,245,210,.35)}
</style></head><body><div class="phone"><div class="screen">
 <div class="island"></div>
 <div class="status"><span>9:41</span><span>Wild Pairs</span><span>100%</span></div>
 <div class="tag">03 · Luxe Felt</div>
 <div class="hud"><span class="pill round felt">Round 3</span><span class="pill scores felt"><i class="a"></i>Us 2&nbsp;&nbsp;<i class="b"></i>Them 1</span><span class="pill pause gold">❚❚</span></div>
 <div class="partner felt"><div class="ptag">Partner · 4 cards</div><div class="pfan">
   <div class="mini card fire"><span class="badge">7</span></div><div class="mini card earth"><span class="badge">3</span></div><div class="mini card rain"><span class="badge">9</span></div><div class="mini card wild"><span class="badge">★</span></div></div></div>
 <div class="mid">
   <div class="opp"><div class="av felt">L</div><span>4 cards</span></div>
   <div class="center"><div class="colour gold">◆ Earth</div><div class="piles"><div class="draw">42</div><div class="card earth big"><span class="idx">0</span><span class="badge">0</span></div></div></div>
   <div class="opp active"><div class="av felt">R</div><span>6 cards</span></div></div>
 <div class="prompt felt">Play an <b>Earth</b> card, a <b>0</b>, or a wild card</div>
 <div class="hand">
   <div class="card fire h1 play"><span class="idx">7</span><span class="badge">7</span></div>
   <div class="card rain h2"><span class="idx">↺</span><span class="badge" style="font-size:24px">↺</span></div>
   <div class="card earth h3 play"><span class="idx">0</span><span class="badge">0</span></div>
   <div class="card wind h4"><span class="idx">+2</span><span class="badge" style="font-size:22px">+2</span></div>
   <div class="card wild h5 play"><span class="idx">★</span><span class="badge" style="font-size:22px">✦</span></div>
   <div class="card fire h6"><span class="idx">9</span><span class="badge">9</span></div></div>
</div></div></body></html>
