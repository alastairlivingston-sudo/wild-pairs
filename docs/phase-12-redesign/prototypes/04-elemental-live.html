<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Pairs — Elemental Live</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#04140e;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
.phone{width:390px;height:844px;border-radius:54px;position:relative;overflow:hidden;background:#000;box-shadow:0 40px 120px -20px #000,0 0 0 11px #16201a,0 0 0 13px #25332b}
/* The whole scene reacts to the ACTIVE element (Earth -> green crystalline) */
.screen{position:absolute;inset:0;overflow:hidden;color:#e9fff4;background:radial-gradient(120% 90% at 50% 120%,#0c3b2a,#06190f 70%)}
.screen::before{content:"";position:absolute;inset:-20%;z-index:0;opacity:.8;background:
 radial-gradient(30% 22% at 20% 70%,rgba(60,255,180,.30),transparent),
 radial-gradient(28% 20% at 80% 60%,rgba(40,220,150,.30),transparent),
 radial-gradient(40% 30% at 50% 110%,rgba(0,255,170,.25),transparent)}
/* drifting "crystal" motes */
.motes{position:absolute;inset:0;z-index:1}
.motes i{position:absolute;width:6px;height:6px;border-radius:2px;background:rgba(120,255,200,.8);box-shadow:0 0 10px #4cffb4;transform:rotate(45deg);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(60px) rotate(45deg);opacity:0}10%{opacity:1}to{transform:translateY(-760px) rotate(225deg);opacity:0}}
.screen>:not(.motes){position:relative;z-index:2}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:5}
.status{display:flex;justify-content:space-between;padding:16px 30px 0;font-size:14px;font-weight:600}
.tag{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:#7dffc4}
.hud{display:flex;align-items:center;gap:8px;padding:14px 18px 6px}
.glass{background:rgba(10,40,28,.5);border:1px solid rgba(90,230,170,.3);box-shadow:inset 0 1px 0 rgba(150,255,210,.25),0 8px 22px -12px #000;backdrop-filter:blur(12px)}
.pill{padding:7px 12px;border-radius:13px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.scores{margin-left:auto}.scores i{width:9px;height:9px;border-radius:50%;display:inline-block}.scores .a{background:#36d39a}.scores .b{background:#ff6a4a}
.pause{width:38px;height:38px;justify-content:center;border-radius:50%;color:#9fffd8}
.partner{margin:8px 16px 0;padding:10px 14px 14px;border-radius:20px}
.ptag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#a8f5d2}
.pfan{display:flex;justify-content:center;margin-top:8px}.pfan .mini{margin-left:-12px}.pfan .mini:first-child{margin-left:0}
.mid{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
.opp{display:flex;flex-direction:column;align-items:center;gap:6px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#e9fff4}
.opp.active .av{box-shadow:0 0 0 2px #5effbf,0 0 30px #16e89a}
.opp span{font-size:12px;font-weight:700;color:#a8f5d2}
.center{display:flex;flex-direction:column;align-items:center;gap:12px}
.colour{padding:8px 18px;border-radius:999px;font-weight:900;font-size:15px;display:flex;gap:8px;align-items:center;color:#03120b;background:linear-gradient(180deg,#7dffc4,#16d28a);box-shadow:0 0 36px #16e89a,inset 0 1px 0 rgba(255,255,255,.7);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 52px #16e89a,inset 0 1px 0 rgba(255,255,255,.7);transform:scale(1.05)}}
.piles{display:flex;gap:16px;align-items:center}
.draw{width:60px;height:90px;border-radius:14px;display:grid;place-items:end center;padding-bottom:6px;font-weight:800;color:#cffde9;background:linear-gradient(160deg,#0f3d2c,#072116);border:1px solid rgba(90,255,190,.45);box-shadow:0 0 22px rgba(20,230,150,.3);position:relative}
.draw::before{content:"";position:absolute;inset:6px;border-radius:9px;border:1px solid rgba(120,255,200,.35)}
.prompt{margin:6px 18px 0;text-align:center;font-size:15px;line-height:1.35;padding:14px 18px;border-radius:18px;color:#e9fff4}
.prompt b{color:#7dffc4}
.hand{position:absolute;bottom:30px;left:0;right:0;height:150px}
.card{border-radius:14px;position:relative;display:grid;place-items:center;font-weight:800;color:#fff;border:1px solid rgba(180,255,225,.3);box-shadow:0 16px 28px -14px #000,inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 22px rgba(20,230,150,.12)}
.card .badge{background:#fff;border-radius:30%;display:grid;place-items:center;font-weight:900}
.card .idx{position:absolute;top:7px;left:9px;font-size:13px}
.fire{background:linear-gradient(160deg,#ff8a5b,#ff5a3c)}.fire .badge{color:#c0392b}
.rain{background:linear-gradient(160deg,#5fb0ff,#2f8bff)}.rain .badge{color:#1a5fd0}
.earth{background:linear-gradient(160deg,#5be8b4,#27c08a)}.earth .badge{color:#10805a}
.wind{background:linear-gradient(160deg,#ffe08a,#ffc83d)}.wind .badge{color:#8a6a12}
.wild{background:linear-gradient(160deg,#3a2b63,#181033)}.wild .badge{background:conic-gradient(#ff5a3c,#2f8bff,#27c08a,#ffc83d,#ff5a3c);color:#fff}
.mini{width:34px;height:50px}.mini .badge{width:20px;height:20px;font-size:11px;border-radius:34%}
.big{width:78px;height:116px}.big .badge{width:48px;height:48px;font-size:30px}
.hand .card{width:84px;height:124px;position:absolute;bottom:0;left:50%;margin-left:-42px;transition:.3s}
.hand .badge{width:50px;height:50px;font-size:32px;border-radius:30%}
.h1{transform:rotate(-12deg) translateX(-108px)}.h2{transform:rotate(-7deg) translateX(-64px) translateY(8px)}
.h3{transform:rotate(-2deg) translateX(-20px)}.h4{transform:rotate(3deg) translateX(24px) translateY(8px)}
.h5{transform:rotate(8deg) translateX(68px)}.h6{transform:rotate(13deg) translateX(112px) translateY(10px)}
.play{bottom:24px;border-color:#7dffc4;box-shadow:0 0 0 2px #7dffc4,0 0 32px #16e89a,0 18px 30px -14px #000}
</style></head><body><div class="phone"><div class="screen">
 <div class="island"></div>
 <div class="motes"><i style="left:14%;animation-duration:9s"></i><i style="left:32%;animation-duration:12s;animation-delay:2s"></i><i style="left:58%;animation-duration:10s;animation-delay:1s"></i><i style="left:74%;animation-duration:13s;animation-delay:3s"></i><i style="left:88%;animation-duration:8s;animation-delay:1.5s"></i><i style="left:46%;animation-duration:11s;animation-delay:4s"></i></div>
 <div class="status"><span>9:41</span><span>Wild Pairs</span><span>100%</span></div>
 <div class="tag">04 · Elemental Live · Earth</div>
 <div class="hud"><span class="pill round glass">Round 3</span><span class="pill scores glass"><i class="a"></i>Us 2&nbsp;&nbsp;<i class="b"></i>Them 1</span><span class="pill pause glass">❚❚</span></div>
 <div class="partner glass"><div class="ptag">Partner · 4 cards</div><div class="pfan">
   <div class="mini card fire"><span class="badge">7</span></div><div class="mini card earth"><span class="badge">3</span></div><div class="mini card rain"><span class="badge">9</span></div><div class="mini card wild"><span class="badge">★</span></div></div></div>
 <div class="mid">
   <div class="opp"><div class="av glass">L</div><span>4 cards</span></div>
   <div class="center"><div class="colour">◆ Earth</div><div class="piles"><div class="draw">42</div><div class="card earth big"><span class="idx">0</span><span class="badge">0</span></div></div></div>
   <div class="opp active"><div class="av glass">R</div><span>6 cards</span></div></div>
 <div class="prompt glass">Play an <b>Earth</b> card, a <b>0</b>, or a wild card</div>
 <div class="hand">
   <div class="card fire h1 play"><span class="idx">7</span><span class="badge">7</span></div>
   <div class="card rain h2"><span class="idx">↺</span><span class="badge" style="font-size:24px">↺</span></div>
   <div class="card earth h3 play"><span class="idx">0</span><span class="badge">0</span></div>
   <div class="card wind h4"><span class="idx">+2</span><span class="badge" style="font-size:22px">+2</span></div>
   <div class="card wild h5 play"><span class="idx">★</span><span class="badge" style="font-size:22px">✦</span></div>
   <div class="card fire h6"><span class="idx">9</span><span class="badge">9</span></div></div>
</div></div></body></html>
