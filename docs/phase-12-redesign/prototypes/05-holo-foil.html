<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Pairs — Holo Foil</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#0a0a12;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
.phone{width:390px;height:844px;border-radius:54px;position:relative;overflow:hidden;background:#000;box-shadow:0 40px 120px -20px #000,0 0 0 11px #15151e,0 0 0 13px #24242f}
.screen{position:absolute;inset:0;overflow:hidden;color:#f0f1ff;background:radial-gradient(120% 70% at 50% 0%,#1a1b2e,#0a0a14 60%)}
.holo{background:linear-gradient(115deg,#ff5edb,#7a5cff,#3df0ff,#5effae,#ffe14d,#ff5edb);background-size:300% 300%;animation:sheen 6s linear infinite}
@keyframes sheen{to{background-position:300% 0}}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:5}
.status{display:flex;justify-content:space-between;padding:16px 30px 0;font-size:14px;font-weight:600}
.tag{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:#9df}
.hud{display:flex;align-items:center;gap:8px;padding:14px 18px 6px}
.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 22px -12px #000}
.pill{padding:7px 12px;border-radius:13px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.scores{margin-left:auto}.scores i{width:9px;height:9px;border-radius:50%;display:inline-block}.scores .a{background:#3df0ff}.scores .b{background:#ff5edb}
.pause{width:38px;height:38px;justify-content:center;border-radius:50%;color:#bdf}
.partner{margin:8px 16px 0;padding:10px 14px 14px;border-radius:20px}
.ptag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.85}
.pfan{display:flex;justify-content:center;margin-top:8px}.pfan .mini{margin-left:-12px}.pfan .mini:first-child{margin-left:0}
.mid{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
.opp{display:flex;flex-direction:column;align-items:center;gap:6px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#eef}
.opp.active .av{box-shadow:0 0 0 2px #3df0ff,0 0 30px #7a5cff}
.opp span{font-size:12px;font-weight:700;opacity:.8}
.center{display:flex;flex-direction:column;align-items:center;gap:12px}
.colour{padding:8px 18px;border-radius:999px;font-weight:900;font-size:15px;display:flex;gap:8px;align-items:center;color:#04130c;box-shadow:0 0 30px rgba(99,240,180,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.piles{display:flex;gap:16px;align-items:center}
.draw{width:60px;height:90px;border-radius:14px;display:grid;place-items:end center;padding-bottom:6px;font-weight:800;color:#def;background:linear-gradient(160deg,#23243a,#12131f);border:1px solid rgba(160,170,255,.4);box-shadow:0 0 20px rgba(120,90,255,.3);position:relative}
.draw::before{content:"";position:absolute;inset:4px;border-radius:9px;opacity:.5;filter:blur(1px)}
.prompt{margin:6px 18px 0;text-align:center;font-size:15px;line-height:1.35;padding:14px 18px;border-radius:18px}
.prompt b{color:#5effae}
.hand{position:absolute;bottom:30px;left:0;right:0;height:150px}
/* holographic foil cards: colour tints the foil, badge stays readable */
.card{border-radius:14px;position:relative;display:grid;place-items:center;font-weight:800;color:#10121f;overflow:hidden;border:1px solid rgba(255,255,255,.55);box-shadow:0 16px 28px -14px #000,inset 0 0 0 1px rgba(255,255,255,.4)}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#ff5edb,#7a5cff,#3df0ff,#5effae,#ffe14d,#ff5edb);background-size:300% 300%;animation:sheen 6s linear infinite;opacity:.9}
.card::after{content:"";position:absolute;inset:0;mix-blend-mode:overlay;background:repeating-linear-gradient(115deg,rgba(255,255,255,.5) 0 2px,transparent 2px 7px)}
.card .badge,.card .idx{position:relative;z-index:2}
.card .badge{background:rgba(255,255,255,.92);border-radius:30%;display:grid;place-items:center;font-weight:900}
.card .idx{position:absolute;top:7px;left:9px;font-size:13px;color:#10121f;text-shadow:0 1px 2px rgba(255,255,255,.6)}
.fire::before{filter:hue-rotate(-30deg) saturate(1.2)}.rain::before{filter:hue-rotate(40deg)}.earth::before{filter:hue-rotate(80deg)}.wind::before{filter:hue-rotate(-70deg) saturate(1.3)}
.fire .badge{color:#c0392b}.rain .badge{color:#1a5fd0}.earth .badge{color:#10805a}.wind .badge{color:#8a6a12}
.wild .badge{color:#5a2b8a}
.mini{width:34px;height:50px}.mini .badge{width:20px;height:20px;font-size:11px;border-radius:34%}
.big{width:78px;height:116px}.big .badge{width:48px;height:48px;font-size:30px}
.hand .card{width:84px;height:124px;position:absolute;bottom:0;left:50%;margin-left:-42px;transition:.3s}
.hand .badge{width:50px;height:50px;font-size:32px;border-radius:30%}
.h1{transform:rotate(-12deg) translateX(-108px)}.h2{transform:rotate(-7deg) translateX(-64px) translateY(8px)}
.h3{transform:rotate(-2deg) translateX(-20px)}.h4{transform:rotate(3deg) translateX(24px) translateY(8px)}
.h5{transform:rotate(8deg) translateX(68px)}.h6{transform:rotate(13deg) translateX(112px) translateY(10px)}
.play{bottom:24px;box-shadow:0 0 0 2px #fff,0 0 34px #3df0ff,0 18px 30px -14px #000}
</style></head><body><div class="phone"><div class="screen">
 <div class="island"></div>
 <div class="status"><span>9:41</span><span>Wild Pairs</span><span>100%</span></div>
 <div class="tag">05 · Holo Foil</div>
 <div class="hud"><span class="pill round panel">Round 3</span><span class="pill scores panel"><i class="a"></i>Us 2&nbsp;&nbsp;<i class="b"></i>Them 1</span><span class="pill pause panel">❚❚</span></div>
 <div class="partner panel"><div class="ptag">Partner · 4 cards</div><div class="pfan">
   <div class="mini card fire"><span class="badge">7</span></div><div class="mini card earth"><span class="badge">3</span></div><div class="mini card rain"><span class="badge">9</span></div><div class="mini card wild"><span class="badge">★</span></div></div></div>
 <div class="mid">
   <div class="opp"><div class="av panel">L</div><span>4 cards</span></div>
   <div class="center"><div class="colour holo">◆ Earth</div><div class="piles"><div class="draw">42</div><div class="card earth big"><span class="idx">0</span><span class="badge">0</span></div></div></div>
   <div class="opp active"><div class="av panel">R</div><span>6 cards</span></div></div>
 <div class="prompt panel">Play an <b>Earth</b> card, a <b>0</b>, or a wild card</div>
 <div class="hand">
   <div class="card fire h1 play"><span class="idx">7</span><span class="badge">7</span></div>
   <div class="card rain h2"><span class="idx">↺</span><span class="badge" style="font-size:24px">↺</span></div>
   <div class="card earth h3 play"><span class="idx">0</span><span class="badge">0</span></div>
   <div class="card wind h4"><span class="idx">+2</span><span class="badge" style="font-size:22px">+2</span></div>
   <div class="card wild h5 play"><span class="idx">★</span><span class="badge" style="font-size:22px">✦</span></div>
   <div class="card fire h6"><span class="idx">9</span><span class="badge">9</span></div></div>
</div></div></body></html>
