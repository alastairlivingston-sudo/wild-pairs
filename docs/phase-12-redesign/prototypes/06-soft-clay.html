<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Pairs — Soft Clay</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#1b1f2a;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,"SF Pro Rounded","SF Pro Display",system-ui,sans-serif}
.phone{width:390px;height:844px;border-radius:54px;position:relative;overflow:hidden;background:#000;box-shadow:0 40px 120px -20px #000,0 0 0 11px #1f2330,0 0 0 13px #2c3140}
.screen{position:absolute;inset:0;overflow:hidden;color:#eef1f8;background:linear-gradient(160deg,#2a3042,#202635 60%,#1a1f2c)}
/* clay = soft double shadow (top-left light, bottom-right dark) + inset highlight */
.clay{background:#2b3142;box-shadow:-7px -7px 16px rgba(255,255,255,.05),9px 11px 22px rgba(0,0,0,.5),inset 1px 1px 1px rgba(255,255,255,.08)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:5}
.status{display:flex;justify-content:space-between;padding:16px 30px 0;font-size:14px;font-weight:700}
.tag{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:#9fb0d8}
.hud{display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
.pill{padding:9px 14px;border-radius:18px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.scores{margin-left:auto}.scores i{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:inset 1px 1px 2px rgba(0,0,0,.4)}.scores .a{background:#5ec8ff}.scores .b{background:#ff8a6b}
.pause{width:42px;height:42px;justify-content:center;border-radius:50%;color:#cfe}
.partner{margin:10px 16px 0;padding:12px 14px 16px;border-radius:26px}
.ptag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#9fb0d8}
.pfan{display:flex;justify-content:center;margin-top:10px}.pfan .mini{margin-left:-12px}.pfan .mini:first-child{margin-left:0}
.mid{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 6px}
.opp{display:flex;flex-direction:column;align-items:center;gap:8px}
.av{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:21px;color:#eef}
.opp.active .av{box-shadow:-6px -6px 14px rgba(255,255,255,.05),7px 9px 18px rgba(0,0,0,.5),0 0 0 3px #7be0b0,0 0 24px rgba(123,224,176,.5)}
.opp span{font-size:12px;font-weight:800;color:#9fb0d8}
.center{display:flex;flex-direction:column;align-items:center;gap:14px}
.colour{padding:10px 20px;border-radius:999px;font-weight:900;font-size:15px;display:flex;gap:8px;align-items:center;color:#093;background:#d6ffe9;box-shadow:-4px -4px 10px rgba(255,255,255,.5),6px 8px 16px rgba(0,90,60,.35);color:#0a7a52}
.piles{display:flex;gap:18px;align-items:center}
.draw{width:62px;height:92px;border-radius:18px;display:grid;place-items:end center;padding-bottom:8px;font-weight:900;color:#cfe;background:#252b3a;box-shadow:-6px -6px 14px rgba(255,255,255,.05),8px 10px 20px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.04)}
.prompt{margin:8px 18px 0;text-align:center;font-size:15px;line-height:1.35;padding:15px 18px;border-radius:22px;color:#eef1f8;font-weight:600}
.prompt b{color:#7be0b0}
.hand{position:absolute;bottom:30px;left:0;right:0;height:152px}
.card{border-radius:20px;position:relative;display:grid;place-items:center;font-weight:900;color:#fff;box-shadow:-4px -4px 10px rgba(255,255,255,.12),8px 11px 20px rgba(0,0,0,.45)}
.card .badge{background:#fff;border-radius:34%;display:grid;place-items:center;font-weight:900;box-shadow:inset -2px -2px 5px rgba(0,0,0,.12),inset 2px 2px 5px rgba(255,255,255,.8)}
.card .idx{position:absolute;top:9px;left:11px;font-size:13px}
.fire{background:radial-gradient(120% 120% at 30% 25%,#ff9d77,#ff6a4a)}.fire .badge{color:#d44a2a}
.rain{background:radial-gradient(120% 120% at 30% 25%,#7fc2ff,#3f93ff)}.rain .badge{color:#2a6fd6}
.earth{background:radial-gradient(120% 120% at 30% 25%,#7af0c0,#34c890)}.earth .badge{color:#149068}
.wind{background:radial-gradient(120% 120% at 30% 25%,#ffe89a,#ffcf57)}.wind .badge{color:#a07a1e}
.wild{background:radial-gradient(120% 120% at 30% 25%,#a98cff,#6a4ad0)}.wild .badge{color:#6a4ad0}
.mini{width:36px;height:52px}.mini .badge{width:22px;height:22px;font-size:11px;border-radius:38%}
.big{width:80px;height:118px}.big .badge{width:50px;height:50px;font-size:30px}
.hand .card{width:86px;height:126px;position:absolute;bottom:0;left:50%;margin-left:-43px;transition:.3s}
.hand .badge{width:52px;height:52px;font-size:32px;border-radius:34%}
.h1{transform:rotate(-12deg) translateX(-108px)}.h2{transform:rotate(-7deg) translateX(-64px) translateY(8px)}
.h3{transform:rotate(-2deg) translateX(-20px)}.h4{transform:rotate(3deg) translateX(24px) translateY(8px)}
.h5{transform:rotate(8deg) translateX(68px)}.h6{transform:rotate(13deg) translateX(112px) translateY(10px)}
.play{bottom:22px;box-shadow:-4px -4px 10px rgba(255,255,255,.14),8px 11px 20px rgba(0,0,0,.45),0 0 0 4px #7be0b0,0 0 26px rgba(123,224,176,.6)}
</style></head><body><div class="phone"><div class="screen">
 <div class="island"></div>
 <div class="status"><span>9:41</span><span>Wild Pairs</span><span>100%</span></div>
 <div class="tag">06 · Soft Clay</div>
 <div class="hud"><span class="pill round clay">Round 3</span><span class="pill scores clay"><i class="a"></i>Us 2&nbsp;&nbsp;<i class="b"></i>Them 1</span><span class="pill pause clay">❚❚</span></div>
 <div class="partner clay"><div class="ptag">Partner · 4 cards</div><div class="pfan">
   <div class="mini card fire"><span class="badge">7</span></div><div class="mini card earth"><span class="badge">3</span></div><div class="mini card rain"><span class="badge">9</span></div><div class="mini card wild"><span class="badge">★</span></div></div></div>
 <div class="mid">
   <div class="opp"><div class="av clay">L</div><span>4 cards</span></div>
   <div class="center"><div class="colour">◆ Earth</div><div class="piles"><div class="draw">42</div><div class="card earth big"><span class="idx">0</span><span class="badge">0</span></div></div></div>
   <div class="opp active"><div class="av clay">R</div><span>6 cards</span></div></div>
 <div class="prompt clay">Play an <b>Earth</b> card, a <b>0</b>, or a wild card</div>
 <div class="hand">
   <div class="card fire h1 play"><span class="idx">7</span><span class="badge">7</span></div>
   <div class="card rain h2"><span class="idx">↺</span><span class="badge" style="font-size:24px">↺</span></div>
   <div class="card earth h3 play"><span class="idx">0</span><span class="badge">0</span></div>
   <div class="card wind h4"><span class="idx">+2</span><span class="badge" style="font-size:22px">+2</span></div>
   <div class="card wild h5 play"><span class="idx">★</span><span class="badge" style="font-size:22px">✦</span></div>
   <div class="card fire h6"><span class="idx">9</span><span class="badge">9</span></div></div>
</div></div></body></html>
