<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Pairs — Midnight Minimal</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#060708;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
.phone{width:390px;height:844px;border-radius:54px;position:relative;overflow:hidden;background:#000;box-shadow:0 40px 120px -20px #000,0 0 0 11px #131416,0 0 0 13px #202225}
.screen{position:absolute;inset:0;overflow:hidden;color:#f2f4f7;background:linear-gradient(180deg,#0c0d10,#0a0b0e)}
.screen::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 50% at 50% 6%,rgba(255,255,255,.05),transparent 60%)}
.screen>*{position:relative;z-index:2}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:5}
.status{display:flex;justify-content:space-between;padding:16px 30px 0;font-size:14px;font-weight:600;color:#cdd1d8}
.tag{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:#6f7682}
.hud{display:flex;align-items:center;gap:10px;padding:16px 20px 6px}
.line{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}
.pill{padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;color:#cdd1d8}
.scores{margin-left:auto}.scores i{width:7px;height:7px;border-radius:50%;display:inline-block}.scores .a{background:#fff}.scores .b{background:#6f7682}
.pause{width:36px;height:36px;justify-content:center;border-radius:10px;color:#cdd1d8}
.partner{margin:12px 20px 0;padding:12px 16px 16px;border-radius:16px}
.ptag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#6f7682}
.pfan{display:flex;justify-content:center;margin-top:10px}.pfan .mini{margin-left:-10px}.pfan .mini:first-child{margin-left:0}
.mid{display:flex;align-items:center;justify-content:space-between;padding:24px 26px 8px}
.opp{display:flex;flex-direction:column;align-items:center;gap:7px}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:18px;color:#cdd1d8}
.opp.active .av{border-color:#fff;box-shadow:0 0 0 1px #fff}
.opp span{font-size:11.5px;font-weight:600;color:#8b929e}
.center{display:flex;flex-direction:column;align-items:center;gap:14px}
.colour{padding:7px 16px;border-radius:999px;font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;color:#0a0b0e;background:#f2f4f7}
.dot{width:9px;height:9px;border-radius:50%;background:#27c08a}
.piles{display:flex;gap:18px;align-items:center}
.draw{width:58px;height:88px;border-radius:12px;display:grid;place-items:end center;padding-bottom:7px;font-weight:600;color:#aeb4be;background:#111317;border:1px solid rgba(255,255,255,.1)}
.prompt{margin:8px 20px 0;text-align:center;font-size:14.5px;line-height:1.4;padding:14px 18px;border-radius:14px;color:#cdd1d8;font-weight:500}
.prompt b{color:#fff;font-weight:700}
.hand{position:absolute;bottom:32px;left:0;right:0;height:150px}
/* minimal cards: near-flat tinted faces, hairline border, single white centre, only ONE accent = the active colour & playable ring */
.card{border-radius:13px;position:relative;display:grid;place-items:center;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 22px -14px #000}
.card .badge{background:#0f1115;border:1px solid rgba(255,255,255,.25);border-radius:28%;display:grid;place-items:center;font-weight:800}
.card .idx{position:absolute;top:8px;left:10px;font-size:12.5px;color:rgba(255,255,255,.85)}
.fire{background:#1a1416;color:#ff6a4a}.rain{background:#121722;color:#5fb0ff}.earth{background:#101d18;color:#27c08a}.wind{background:#1c1810;color:#e9c24a}.wild{background:#171522;color:#b59bff}
.fire .badge,.rain .badge,.earth .badge,.wind .badge,.wild .badge{color:#fff}
.mini{width:32px;height:48px}.mini .badge{width:18px;height:18px;font-size:10px;border-radius:32%}
.big{width:74px;height:110px}.big .badge{width:44px;height:44px;font-size:26px}
.hand .card{width:82px;height:122px;position:absolute;bottom:0;left:50%;margin-left:-41px;transition:.3s}
.hand .badge{width:46px;height:46px;font-size:28px;border-radius:28%}
.h1{transform:rotate(-11deg) translateX(-104px)}.h2{transform:rotate(-6deg) translateX(-62px) translateY(8px)}
.h3{transform:rotate(-2deg) translateX(-20px)}.h4{transform:rotate(3deg) translateX(22px) translateY(8px)}
.h5{transform:rotate(7deg) translateX(64px)}.h6{transform:rotate(12deg) translateX(106px) translateY(10px)}
.play{bottom:22px;border-color:#fff;box-shadow:0 0 0 1.5px #fff,0 14px 26px -14px #000}
</style></head><body><div class="phone"><div class="screen">
 <div class="island"></div>
 <div class="status"><span>9:41</span><span>Wild Pairs</span><span>100%</span></div>
 <div class="tag">07 · Midnight Minimal</div>
 <div class="hud"><span class="pill round line">Round 3</span><span class="pill scores line"><i class="a"></i>Us 2&nbsp;&nbsp;<i class="b"></i>Them 1</span><span class="pill pause line">❚❚</span></div>
 <div class="partner line"><div class="ptag">Partner · 4 cards</div><div class="pfan">
   <div class="mini card fire"><span class="badge">7</span></div><div class="mini card earth"><span class="badge">3</span></div><div class="mini card rain"><span class="badge">9</span></div><div class="mini card wild"><span class="badge">★</span></div></div></div>
 <div class="mid">
   <div class="opp"><div class="av line">L</div><span>4 cards</span></div>
   <div class="center"><div class="colour"><span class="dot"></span>Earth</div><div class="piles"><div class="draw">42</div><div class="card earth big"><span class="idx">0</span><span class="badge">0</span></div></div></div>
   <div class="opp active"><div class="av line">R</div><span>6 cards</span></div></div>
 <div class="prompt line">Play an <b>Earth</b> card, a <b>0</b>, or a wild card</div>
 <div class="hand">
   <div class="card fire h1 play"><span class="idx">7</span><span class="badge">7</span></div>
   <div class="card rain h2"><span class="idx">↺</span><span class="badge" style="font-size:22px">↺</span></div>
   <div class="card earth h3 play"><span class="idx">0</span><span class="badge">0</span></div>
   <div class="card wind h4"><span class="idx">+2</span><span class="badge" style="font-size:20px">+2</span></div>
   <div class="card wild h5 play"><span class="idx">★</span><span class="badge" style="font-size:20px">✦</span></div>
   <div class="card fire h6"><span class="idx">9</span><span class="badge">9</span></div></div>
</div></div></body></html>
