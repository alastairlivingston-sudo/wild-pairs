<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Pairs — Synthwave Grid</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#0a0418;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
.phone{width:390px;height:844px;border-radius:54px;position:relative;overflow:hidden;background:#000;box-shadow:0 40px 120px -20px #000,0 0 0 11px #190a2a,0 0 0 13px #2a1140}
.screen{position:absolute;inset:0;overflow:hidden;color:#ffe9fb;background:linear-gradient(180deg,#1b0838 0%,#3a0d4e 38%,#5a1140 52%,#12051f 53%)}
/* sun */
.screen::before{content:"";position:absolute;top:78px;left:50%;transform:translateX(-50%);width:200px;height:200px;border-radius:50%;background:linear-gradient(#ffd24d,#ff5edb);box-shadow:0 0 80px rgba(255,94,219,.6);clip-path:inset(0 0 35% 0)}
/* perspective grid floor */
.grid{position:absolute;left:-30%;right:-30%;bottom:0;height:48%;z-index:1;
 background:linear-gradient(transparent,rgba(255,94,219,.15)),
  repeating-linear-gradient(90deg,transparent 0 38px,rgba(61,240,255,.6) 38px 40px),
  repeating-linear-gradient(0deg,transparent 0 30px,rgba(61,240,255,.5) 30px 32px);
 transform:perspective(280px) rotateX(64deg);transform-origin:bottom;opacity:.55}
.screen>:not(.grid){position:relative;z-index:2}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:5}
.status{display:flex;justify-content:space-between;padding:16px 30px 0;font-size:14px;font-weight:600;text-shadow:0 0 6px rgba(255,94,219,.8)}
.tag{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-weight:800;color:#3df0ff;text-shadow:0 0 10px #3df0ff}
.hud{display:flex;align-items:center;gap:8px;padding:14px 18px 6px}
.neon{background:rgba(20,6,40,.5);border:1px solid #ff5edb;box-shadow:0 0 14px rgba(255,94,219,.5),inset 0 0 10px rgba(255,94,219,.2)}
.pill{padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px;letter-spacing:.03em}
.scores{margin-left:auto}.scores i{width:9px;height:9px;border-radius:50%;display:inline-block}.scores .a{background:#3df0ff;box-shadow:0 0 8px #3df0ff}.scores .b{background:#ff5edb;box-shadow:0 0 8px #ff5edb}
.pause{width:38px;height:38px;justify-content:center;border-radius:9px;color:#3df0ff;border-color:#3df0ff;box-shadow:0 0 14px rgba(61,240,255,.5)}
.partner{margin:8px 16px 0;padding:10px 14px 14px;border-radius:12px}
.ptag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#ff9ae8}
.pfan{display:flex;justify-content:center;margin-top:8px}.pfan .mini{margin-left:-12px}.pfan .mini:first-child{margin-left:0}
.mid{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 6px}
.opp{display:flex;flex-direction:column;align-items:center;gap:6px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#ffe9fb}
.opp.active .av{box-shadow:0 0 0 2px #3df0ff,0 0 26px #3df0ff}
.opp span{font-size:12px;font-weight:800;color:#ff9ae8}
.center{display:flex;flex-direction:column;align-items:center;gap:12px}
.colour{padding:8px 16px;border-radius:6px;font-weight:900;font-size:14px;display:flex;gap:8px;align-items:center;color:#04130c;background:linear-gradient(180deg,#5effae,#16d28a);box-shadow:0 0 26px #16e89a}
.piles{display:flex;gap:16px;align-items:center}
.draw{width:60px;height:90px;border-radius:8px;display:grid;place-items:end center;padding-bottom:6px;font-weight:800;color:#bff;background:linear-gradient(160deg,#1a0838,#0c0420);border:1px solid #3df0ff;box-shadow:0 0 18px rgba(61,240,255,.4);position:relative}
.prompt{margin:6px 18px 0;text-align:center;font-size:15px;line-height:1.35;padding:13px 18px;border-radius:10px;color:#ffe9fb}
.prompt b{color:#5effae}
.hand{position:absolute;bottom:30px;left:0;right:0;height:150px}
/* chrome-edged neon cards */
.card{border-radius:11px;position:relative;display:grid;place-items:center;font-weight:800;color:#fff;border:1.5px solid rgba(255,255,255,.6);box-shadow:0 16px 28px -14px #000,0 0 14px rgba(255,94,219,.25),inset 0 1px 0 rgba(255,255,255,.5)}
.card .badge{background:#0c0420;border:1.5px solid currentColor;border-radius:24%;display:grid;place-items:center;font-weight:900;text-shadow:0 0 8px}
.card .idx{position:absolute;top:7px;left:9px;font-size:13px}
.fire{background:linear-gradient(160deg,#2a0a18,#160510);color:#ff6a8a}.rain{background:linear-gradient(160deg,#081a3a,#04102a);color:#3df0ff}
.earth{background:linear-gradient(160deg,#062a20,#03160f);color:#5effae}.wind{background:linear-gradient(160deg,#2a200a,#160f05);color:#ffe14d}
.wild{background:linear-gradient(160deg,#2a0a3a,#140520);color:#ff5edb}
.wild .badge{background:conic-gradient(#ff5edb,#3df0ff,#5effae,#ffe14d,#ff5edb);color:#fff;border:none}
.mini{width:34px;height:50px}.mini .badge{width:20px;height:20px;font-size:11px;border-radius:28%}
.big{width:78px;height:116px}.big .badge{width:48px;height:48px;font-size:30px}
.hand .card{width:84px;height:124px;position:absolute;bottom:0;left:50%;margin-left:-42px;transition:.3s}
.hand .badge{width:50px;height:50px;font-size:32px;border-radius:24%}
.h1{transform:rotate(-12deg) translateX(-108px)}.h2{transform:rotate(-7deg) translateX(-64px) translateY(8px)}
.h3{transform:rotate(-2deg) translateX(-20px)}.h4{transform:rotate(3deg) translateX(24px) translateY(8px)}
.h5{transform:rotate(8deg) translateX(68px)}.h6{transform:rotate(13deg) translateX(112px) translateY(10px)}
.play{bottom:24px;box-shadow:0 0 0 2px #3df0ff,0 0 30px #3df0ff,0 18px 30px -14px #000}
</style></head><body><div class="phone"><div class="screen">
 <div class="island"></div><div class="grid"></div>
 <div class="status"><span>9:41</span><span>Wild Pairs</span><span>100%</span></div>
 <div class="tag">08 · Synthwave Grid</div>
 <div class="hud"><span class="pill round neon">Round 3</span><span class="pill scores neon"><i class="a"></i>Us 2&nbsp;&nbsp;<i class="b"></i>Them 1</span><span class="pill pause neon">❚❚</span></div>
 <div class="partner neon"><div class="ptag">Partner · 4 cards</div><div class="pfan">
   <div class="mini card fire"><span class="badge">7</span></div><div class="mini card earth"><span class="badge">3</span></div><div class="mini card rain"><span class="badge">9</span></div><div class="mini card wild"><span class="badge">★</span></div></div></div>
 <div class="mid">
   <div class="opp"><div class="av neon">L</div><span>4 cards</span></div>
   <div class="center"><div class="colour">◆ Earth</div><div class="piles"><div class="draw">42</div><div class="card earth big"><span class="idx">0</span><span class="badge">0</span></div></div></div>
   <div class="opp active"><div class="av neon">R</div><span>6 cards</span></div></div>
 <div class="prompt neon">Play an <b>Earth</b> card, a <b>0</b>, or a wild card</div>
 <div class="hand">
   <div class="card fire h1 play"><span class="idx">7</span><span class="badge">7</span></div>
   <div class="card rain h2"><span class="idx">↺</span><span class="badge" style="font-size:24px">↺</span></div>
   <div class="card earth h3 play"><span class="idx">0</span><span class="badge">0</span></div>
   <div class="card wind h4"><span class="idx">+2</span><span class="badge" style="font-size:22px">+2</span></div>
   <div class="card wild h5 play"><span class="idx">★</span><span class="badge" style="font-size:22px">✦</span></div>
   <div class="card fire h6"><span class="idx">9</span><span class="badge">9</span></div></div>
</div></div></body></html>
