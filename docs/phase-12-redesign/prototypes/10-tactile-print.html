<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Pairs — Tactile Print</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#13110e;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,"SF Pro Display","Georgia",system-ui,serif}
.phone{width:390px;height:844px;border-radius:54px;position:relative;overflow:hidden;background:#000;box-shadow:0 40px 120px -20px #000,0 0 0 11px #20180f,0 0 0 13px #34281a}
.screen{position:absolute;inset:0;overflow:hidden;color:#efe6d4;background:radial-gradient(120% 80% at 50% -10%,#2c4a3e,#16261f 60%,#0f1a15)}
/* warm key light from top + paper grain */
.screen::before{content:"";position:absolute;inset:0;background:radial-gradient(50% 30% at 50% 4%,rgba(255,240,200,.18),transparent 70%)}
.screen::after{content:"";position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="60" height="60" filter="url(%23n)"/></svg>')}
.screen>*{position:relative;z-index:2}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:5}
.status{display:flex;justify-content:space-between;padding:16px 30px 0;font-size:14px;font-weight:600;font-family:-apple-system,system-ui}
.tag{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#cbb98c;font-family:-apple-system,system-ui}
.hud{display:flex;align-items:center;gap:8px;padding:14px 18px 6px;font-family:-apple-system,system-ui}
.paper{background:rgba(244,236,217,.1);border:1px solid rgba(203,185,140,.3);box-shadow:inset 0 1px 0 rgba(244,236,217,.18),0 6px 16px -10px #000}
.pill{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.scores{margin-left:auto}.scores i{width:9px;height:9px;border-radius:50%;display:inline-block}.scores .a{background:#3f8f6a}.scores .b{background:#bb5238}
.pause{width:38px;height:38px;justify-content:center;border-radius:50%;color:#e7d9b3}
.partner{margin:8px 16px 0;padding:10px 14px 14px;border-radius:14px;font-family:-apple-system,system-ui}
.ptag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#cbb98c}
.pfan{display:flex;justify-content:center;margin-top:8px}.pfan .mini{margin-left:-12px}.pfan .mini:first-child{margin-left:0}
.mid{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px;font-family:-apple-system,system-ui}
.opp{display:flex;flex-direction:column;align-items:center;gap:6px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#efe6d4}
.opp.active .av{box-shadow:0 0 0 2px #e0c98a,0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.opp span{font-size:12px;font-weight:700;color:#c9b88a}
.center{display:flex;flex-direction:column;align-items:center;gap:12px}
.colour{padding:7px 16px;border-radius:999px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;color:#0c2a1e;background:#dfd0a0;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 10px -4px #000}
.piles{display:flex;gap:16px;align-items:center}
.draw{width:60px;height:90px;border-radius:8px;display:grid;place-items:end center;padding-bottom:6px;font-weight:800;color:#1a3329;background:repeating-linear-gradient(45deg,#1f5141 0 6px,#1b4738 6px 12px);border:2px solid #efe6d4;box-shadow:0 8px 18px -8px #000,2px 3px 0 rgba(0,0,0,.18);position:relative;font-family:-apple-system,system-ui}
.draw span{background:#efe6d4;color:#1a3329;padding:1px 6px;border-radius:6px;font-size:12px}
.prompt{margin:6px 18px 0;text-align:center;font-size:15px;line-height:1.35;padding:13px 18px;border-radius:12px;color:#efe6d4;font-family:-apple-system,system-ui}
.prompt b{color:#8fe0b4}
.hand{position:absolute;bottom:30px;left:0;right:0;height:150px}
/* matte printed cards: flat ink, crisp white border, letterpress badge, realistic stacking shadow */
.card{border-radius:9px;position:relative;display:grid;place-items:center;font-weight:800;color:#fffaf0;border:3px solid #fbf6e9;box-shadow:0 14px 22px -12px rgba(0,0,0,.7),2px 3px 0 rgba(0,0,0,.12)}
.card .badge{background:#fbf6e9;border-radius:18%;display:grid;place-items:center;font-weight:900;box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.18),inset 0 1.5px 0 rgba(255,255,255,.7)}
.card .idx{position:absolute;top:6px;left:8px;font-size:13px;font-family:Georgia,serif}
.fire{background:#c0392b}.fire .badge{color:#c0392b}.rain{background:#1f5fa8}.rain .badge{color:#1f5fa8}
.earth{background:#1e8a5c}.earth .badge{color:#1e7a50}.wind{background:#c79a2e}.wind .badge{color:#8a6a12}
.wild{background:#2e2440}.wild .badge{color:#2e2440}
.mini{width:34px;height:50px}.mini .badge{width:20px;height:20px;font-size:11px;border-radius:16%}
.big{width:78px;height:116px}.big .badge{width:48px;height:48px;font-size:30px;font-family:Georgia,serif}
.hand .card{width:84px;height:124px;position:absolute;bottom:0;left:50%;margin-left:-42px;transition:.3s}
.hand .badge{width:50px;height:50px;font-size:32px;border-radius:16%;font-family:Georgia,serif}
.h1{transform:rotate(-12deg) translateX(-108px)}.h2{transform:rotate(-7deg) translateX(-64px) translateY(8px)}
.h3{transform:rotate(-2deg) translateX(-20px)}.h4{transform:rotate(3deg) translateX(24px) translateY(8px)}
.h5{transform:rotate(8deg) translateX(68px)}.h6{transform:rotate(13deg) translateX(112px) translateY(10px)}
.play{bottom:24px;border-color:#ffe9a8;box-shadow:0 0 0 3px #e0c98a,0 16px 26px -12px rgba(0,0,0,.7)}
</style></head><body><div class="phone"><div class="screen">
 <div class="island"></div>
 <div class="status"><span>9:41</span><span>Wild Pairs</span><span>100%</span></div>
 <div class="tag">10 · Tactile Print</div>
 <div class="hud"><span class="pill round paper">Round 3</span><span class="pill scores paper"><i class="a"></i>Us 2&nbsp;&nbsp;<i class="b"></i>Them 1</span><span class="pill pause paper">❚❚</span></div>
 <div class="partner paper"><div class="ptag">Partner · 4 cards</div><div class="pfan">
   <div class="mini card fire"><span class="badge">7</span></div><div class="mini card earth"><span class="badge">3</span></div><div class="mini card rain"><span class="badge">9</span></div><div class="mini card wild"><span class="badge">★</span></div></div></div>
 <div class="mid">
   <div class="opp"><div class="av paper">L</div><span>4 cards</span></div>
   <div class="center"><div class="colour">◆ Earth</div><div class="piles"><div class="draw"><span>42</span></div><div class="card earth big"><span class="idx">0</span><span class="badge">0</span></div></div></div>
   <div class="opp active"><div class="av paper">R</div><span>6 cards</span></div></div>
 <div class="prompt paper">Play an <b>Earth</b> card, a <b>0</b>, or a wild card</div>
 <div class="hand">
   <div class="card fire h1 play"><span class="idx">7</span><span class="badge">7</span></div>
   <div class="card rain h2"><span class="idx">↺</span><span class="badge" style="font-size:24px">↺</span></div>
   <div class="card earth h3 play"><span class="idx">0</span><span class="badge">0</span></div>
   <div class="card wind h4"><span class="idx">+2</span><span class="badge" style="font-size:22px">+2</span></div>
   <div class="card wild h5 play"><span class="idx">★</span><span class="badge" style="font-size:22px">✦</span></div>
   <div class="card fire h6"><span class="idx">9</span><span class="badge">9</span></div></div>
</div></div></body></html>
