<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 — Studio Minimal</title>
<style>
  :root {
    --fire:#E8431F; --fire-hi:#FF8A3D; --rain:#1B5FD9; --rain-hi:#4FD2F0;
    --earth:#2F8F5B; --earth-hi:#8FAE99; --wind:#C9A227; --wind-hi:#D8C77E;
    --wild:#232030; --wild-hi:#3A3550; --ink:#EEF0FF; --table:#0D0820;
  }
  body {
    margin:0; padding:40px 48px 80px;
    background: radial-gradient(1200px 800px at 50% 20%, #1A1242, #0D0820);
    color:var(--ink); font-family:-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif;
  }
  h1 { font-size:22px; font-weight:700; margin:0 0 4px; }
  .thesis { color:#9BA0C8; margin:0 0 36px; font-size:15px; }
  h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.12em;
       color:#8A8FB8; margin:42px 0 14px; }
  .row { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }

  .card {
    position:relative; border-radius:14px; overflow:hidden; flex:none;
    box-shadow: 0 1px 1px #000c, 0 10px 24px #00000073;
  }
  .face { position:absolute; inset:0; }
  /* Production gloss: one quiet sheen, nothing else competes. */
  .gloss { position:absolute; inset:0;
    background: linear-gradient(157deg, #ffffff2b 0%, #ffffff08 34%, transparent 55%); }

  .fire  .face { background:var(--fire); }
  .rain  .face { background:var(--rain); }
  .earth .face { background:var(--earth); }
  .wind  .face { background:var(--wind); }
  .wildc .face { background:linear-gradient(150deg, var(--wild-hi), var(--wild) 60%); }

  /* The one idea: a huge ultra-light numeral/glyph, cropped off the right edge. */
  .hero { position:absolute; top:50%; right:0; transform:translate(28%,-50%);
    font-weight:200; color:#ffffffec; line-height:1; letter-spacing:-.04em; }
  .hero svg { display:block; }

  .idx { position:absolute; display:flex; flex-direction:column; align-items:center; gap:2px;
    color:#fff; font-weight:700; }
  .idx.tl { top:0; left:0; }
  .idx.br { bottom:0; right:0; transform:rotate(180deg); }
  .idx .r { line-height:1; }
  .idx svg { display:block; }

  .patt { position:absolute; inset:0; opacity:.13; }
  .cap { font-size:11px; color:#7B80A8; margin-top:8px; text-align:center; }
  .cardwrap { display:flex; flex-direction:column; align-items:center; }
  .fan { position:relative; height:250px; }
  .fan .card { position:absolute; bottom:0; transform-origin:50% 120%; }
</style>
</head>
<body>
<h1>01 · Studio Minimal</h1>
<p class="thesis">A designer object: one flat colour, one huge quiet numeral, nothing else. (UNO Minimalista lineage — premium through restraint.)</p>

<svg width="0" height="0" style="position:absolute" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="flame"><path d="M12 2.5C9.2 6.1 6.5 8.8 6.5 13a5.5 5.5 0 0 0 11 0c0-4.2-2.7-6.9-5.5-10.5Z"
      fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></g>
    <g id="wave"><path d="M3 9.5c3-4.2 6-4.2 9 0s6 4.2 9 0M3 15.5c3-4.2 6-4.2 9 0s6 4.2 9 0"
      fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="crystal"><path d="M12 2 19 9.5 12 22 5 9.5Z M5 9.5h14 M12 2 9.6 9.5 12 22l2.4-12.5L12 2Z"
      fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></g>
    <g id="gust"><path d="M3 8h9.5a3 3 0 1 0-3-3M3 13h14.5a3.2 3.2 0 1 1-3.2 3.2M3 18h7.5"
      fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
    <pattern id="p-hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="none"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fff" stroke-width="2"/></pattern>
    <pattern id="p-horiz" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="8" y2="2" stroke="#fff" stroke-width="2"/></pattern>
    <pattern id="p-vert" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="2" y1="0" x2="2" y2="8" stroke="#fff" stroke-width="2"/></pattern>
    <pattern id="p-dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#fff"/></pattern>
  </defs>
</svg>

<div id="app"></div>

<script>
const SUITS = { fire:'flame', rain:'wave', earth:'crystal', wind:'gust' };
const PATTERNS = { fire:'p-hatch', rain:'p-horiz', earth:'p-vert', wind:'p-dots' };

// Ultra-light stroke glyphs, same voice as the numeral. u = glyph box size.
function glyph(kind, u, sw) {
  const s = `fill="none" stroke="#ffffffec" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"`;
  const person = (cx,cy,k) => `<circle cx="${cx}" cy="${cy-k*0.85}" r="${k*0.5}" ${s}/>
    <path d="M${cx-k} ${cy+k*1.15} c0-${k*0.85} ${k*0.42}-${k*1.3} ${k}-${k*1.3} s${k} ${k*0.45} ${k} ${k*1.3}" ${s}/>`;
  const mini = (x,y,w,r) => `<rect x="${x}" y="${y}" width="${w}" height="${w*1.4}" rx="${w*0.16}" ${s} transform="rotate(${r} ${x+w/2} ${y+w*0.7})"/>`;
  switch (kind) {
    case 'skip': return `<svg width="${u}" height="${u}" viewBox="0 0 48 48">${person(24,26,7)}
      <circle cx="24" cy="24" r="20" ${s}/><line x1="10.2" y1="9.4" x2="38.6" y2="37.8" ${s}/></svg>`;
    case 'skipTwo': return `<svg width="${u}" height="${u}" viewBox="0 0 48 48">${person(16,26,5.6)}${person(32,26,5.6)}
      <circle cx="24" cy="24" r="21" ${s}/><line x1="9.5" y1="9.9" x2="39" y2="38.6" ${s}/></svg>`;
    case 'reverse': return `<svg width="${u}" height="${u}" viewBox="0 0 48 48">
      <path d="M37 19a14.5 14.5 0 0 0-24.5-4.5M11 29a14.5 14.5 0 0 0 24.5 4.5" ${s}/>
      <path d="M12.5 7v8h8M35.5 41v-8h-8" ${s}/></svg>`;
    case 'targetedDraw': return `<svg width="${u}" height="${u}" viewBox="0 0 48 48">
      <circle cx="22" cy="22" r="13" ${s}/><circle cx="22" cy="22" r="1.6" fill="#ffffffec"/>
      <path d="M22 4.5v6M22 33.5v6M4.5 22h6M33.5 22h6" ${s}/>${mini(33,32,10,12)}</svg>`;
    case 'forcedSwap': return `<svg width="${u}" height="${u}" viewBox="0 0 48 48">${mini(5,6,12,-8)}${mini(31,26,12,8)}
      <path d="M30 12h9M36 8.5l3.5 3.5L36 15.5M18 36H9M12 32.5 8.5 36l3.5 3.5" ${s}/></svg>`;
    case 'teamPlay': return `<svg width="${u}" height="${u}" viewBox="0 0 48 48">${person(12,20,5.4)}${person(36,20,5.4)}${mini(18,26,11.5,0)}</svg>`;
    case 'discardAll': return `<svg width="${u}" height="${u}" viewBox="0 0 48 48">${mini(8,16,11,-22)}${mini(19,10,11,0)}${mini(30,16,11,22)}
      <path d="M12 40h24" ${s}/></svg>`;
  }
  return '';
}

function suitIcon(suit, sz, col) {
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" style="color:${col}"><use href="#${SUITS[suit]}"/></svg>`;
}

// spec: {suit, kind, value}. size: {w,h,scale}
function card(spec, w, patterned) {
  const h = Math.round(w * 1.4), k = w / 150;
  const isWild = spec.suit === 'wild';
  const cls = isWild ? 'wildc' : spec.suit;
  let hero = '';
  const numeralSize = Math.round(150 * k);
  if (spec.kind === 'number') {
    hero = `<div class="hero" style="font-size:${numeralSize}px">${spec.value}</div>`;
  } else if (spec.kind === 'drawTwo') {
    hero = `<div class="hero" style="font-size:${Math.round(110*k)}px">+2</div>`;
  } else if (spec.kind === 'drawFour') {
    hero = `<div class="hero" style="font-size:${Math.round(110*k)}px">+4</div>`;
  } else if (spec.kind === 'changeColour') {
    hero = `<div class="hero" style="transform:translate(14%,-50%)">${chips(Math.round(84*k))}</div>`;
  } else {
    hero = `<div class="hero" style="transform:translate(16%,-50%)">${glyph(spec.kind, Math.round(112*k), 1.7)}</div>`;
  }
  const idxR = spec.kind === 'number' ? spec.value
    : spec.kind === 'drawTwo' ? '+2' : spec.kind === 'drawFour' ? '+4'
    : spec.kind === 'skipTwo' ? '' : '';
  const idxGlyph = (spec.kind !== 'number' && spec.kind !== 'drawTwo' && spec.kind !== 'drawFour' && spec.kind !== 'changeColour')
    ? glyph(spec.kind, Math.round(17*k), 3.4) : '';
  const idxChips = spec.kind === 'changeColour' || isWild && spec.kind === 'drawFour' ? '' : '';
  const suitMark = isWild ? chips(Math.round(15*k)) : suitIcon(spec.suit, Math.round(15*k), '#fff');
  const idx = (pos) => `<div class="idx ${pos}" style="padding:${10*k}px ${11*k}px; font-size:${20*k}px">
      ${idxR ? `<div class="r">${idxR}</div>` : idxGlyph}${suitMark}</div>`;
  const patt = patterned && !isWild
    ? `<svg class="patt" width="100%" height="100%"><rect width="100%" height="100%" fill="url(#${PATTERNS[spec.suit]})"/></svg>` : '';
  const drawFourChips = spec.kind === 'drawFour'
    ? `<div style="position:absolute;left:${12*k}px;bottom:${12*k}px">${chips(Math.round(34*k))}</div>` : '';
  return `<div class="card ${cls}" style="width:${w}px;height:${h}px">
    <div class="face"></div>${patt}${hero}${drawFourChips}${idx('tl')}${idx('br')}<div class="gloss"></div></div>`;
}

// Wild trade dress: the four element chips in a diamond — precise, small, flat.
function chips(sz) {
  const c = ['var(--fire)','var(--rain)','var(--earth)','var(--wind)'];
  const names = ['fire','rain','earth','wind'];
  const r = sz/2, chip = sz*0.34;
  let out = `<div style="position:relative;width:${sz}px;height:${sz}px">`;
  [[r- chip/2, 0],[sz-chip, r-chip/2],[r-chip/2, sz-chip],[0, r-chip/2]].forEach(([x,y],i) => {
    out += `<div style="position:absolute;left:${x}px;top:${y}px;width:${chip}px;height:${chip}px;border-radius:22%;
      background:${c[i]};display:flex;align-items:center;justify-content:center">
      ${sz > 40 ? suitIcon(names[i], chip*0.62, '#fff') : ''}</div>`;
  });
  return out + '</div>';
}

const numbers = [ {suit:'fire',kind:'number',value:7}, {suit:'rain',kind:'number',value:3},
  {suit:'earth',kind:'number',value:0}, {suit:'wind',kind:'number',value:9} ];
const actions = [ {suit:'fire',kind:'skip'}, {suit:'rain',kind:'reverse'}, {suit:'earth',kind:'drawTwo'},
  {suit:'wind',kind:'skipTwo'}, {suit:'fire',kind:'targetedDraw'}, {suit:'rain',kind:'forcedSwap'},
  {suit:'earth',kind:'teamPlay'}, {suit:'wind',kind:'discardAll'} ];
const wilds = [ {suit:'wild',kind:'changeColour'}, {suit:'wild',kind:'drawFour'} ];

function row(title, specs, w, patterned) {
  return `<h2>${title}</h2><div class="row">` + specs.map(s =>
    `<div class="cardwrap">${card(s, w, patterned)}</div>`).join('') + '</div>';
}
const fanSpecs = [ {suit:'fire',kind:'number',value:7}, {suit:'fire',kind:'skip'},
  {suit:'rain',kind:'number',value:3}, {suit:'wind',kind:'number',value:9}, {suit:'earth',kind:'drawTwo'} ];
function fan() {
  let out = '<h2>Fan test — only the corner survives overlap</h2><div class="fan" style="width:520px">';
  fanSpecs.forEach((s,i) => {
    out += `<div style="position:absolute;left:${i*78}px;bottom:0;transform:rotate(${(i-2)*4}deg);transform-origin:50% 130%">${card(s,150,false)}</div>`;
  });
  return out + '</div>';
}

document.getElementById('app').innerHTML =
  row('Numbers', numbers, 150, false) +
  row('Actions — glyphs in the same quiet voice', actions, 150, false) +
  row('Wilds', wilds, 150, false) +
  fan() +
  row('Small scale (opponents / discard)', [...numbers.slice(0,2), wilds[0]], 64, false) +
  row('Colour-blind patterns on', numbers, 150, true);
</script>
</body>
</html>
