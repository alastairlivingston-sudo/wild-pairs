<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solo Hyper Sweep V3 Card System</title>
<style>
:root {
  --bg:#111216; --panel:#1b1d22; --ink:#f5f6f8; --muted:#aeb4bd;
  --fire:#E8431F; --rain:#1B5FD9; --earth:#2F8F5B; --wind:#C9A227;
}
* { box-sizing: border-box; }
body { margin:0; background: radial-gradient(circle at 50% 0%, #30323a, var(--bg) 36%, #090a0d 100%); color:var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { padding:48px clamp(24px,5vw,72px) 20px; }
h1 { margin:0; font-size:clamp(34px,5vw,72px); letter-spacing:-.04em; }
p { max-width:980px; color:var(--muted); font-size:18px; line-height:1.5; }
.controls { display:flex; gap:12px; flex-wrap:wrap; margin:22px 0; }
button { border:1px solid #3a3d47; background:#1d2027; color:#fff; border-radius:999px; padding:10px 16px; font-weight:750; cursor:pointer; }
button.active { background:#fff; color:#111; }
main { padding:0 clamp(20px,4vw,64px) 70px; }
section { margin:42px 0 70px; }
h2 { font-size:28px; margin:0 0 24px; letter-spacing:-.03em; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:28px; align-items:start; }
.cardTile { position:relative; transform-style:preserve-3d; transition: transform .18s ease, filter .18s ease; }
.cardTile:hover { transform: translateY(-8px) rotateX(2deg); filter:brightness(1.06); z-index:2; }
.cardTile img { width:100%; display:block; border-radius:8%; filter: drop-shadow(0 18px 20px rgba(0,0,0,.55)) drop-shadow(0 3px 3px rgba(0,0,0,.45)); }
.meta { margin-top:10px; display:flex; justify-content:space-between; gap:8px; color:#b7bcc6; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
.swatch { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:-1px; }
.hero { display:flex; gap:22px; overflow-x:auto; padding:28px 0 12px; }
.hero img { width:min(29vw,360px); min-width:220px; border-radius:8%; filter:drop-shadow(0 28px 28px rgba(0,0,0,.62)); transform:rotate(var(--r)); margin-right:-72px; }
.hero img:last-child { margin-right:0; }
a { color:#fff; }
</style>
</head>
<body>
<header>
  <h1>Solo — Hyper Sweep V3</h1>
  <p>A production-style rendered card system using large raster masters: raised white/silver slab marks, black extrusion shadows, laminated white rims, visible colour-blind patterns, glossy diagonal sweep fields, and mirrored corner indices.</p>
  <div class="controls" id="filters"><button class="active" data-filter="all">All</button><button data-filter="number">Numbers</button><button data-filter="action">Actions</button><button data-filter="wild">Wild</button><button data-filter="fire">Fire</button><button data-filter="rain">Rain</button><button data-filter="earth">Earth</button><button data-filter="wind">Wind</button></div>
</header>

    "display": "discard_all",
    "png": "cards_png/wild_discard_all.png",
    "svg": "cards_svg/wild_discard_all.svg"
  }
];
const colorHex = { fire:'#E8431F', rain:'#1B5FD9', earth:'#2F8F5B', wind:'#C9A227', wild:'#111114' };
const grid = document.getElementById('grid');
function label(c) {
  if (c.kind === 'number') return `${c.color} ${c.value}`;
  if (c.kind === 'wild') return `wild ${c.type}`;
  return `${c.color} ${c.type}`;
}
function render(filter='all') {
  grid.innerHTML='';
  cards.filter(c => filter==='all' || c.kind===filter || c.color===filter || (filter==='wild' && c.wild)).forEach(c => {
    const tile=document.createElement('article'); tile.className='cardTile';
    const img=document.createElement('img'); img.src=c.png; img.alt=label(c); tile.appendChild(img);
    const meta=document.createElement('div'); meta.className='meta';
    const col=c.wild?'wild':c.color; meta.innerHTML=`<span><i class="swatch" style="background:${colorHex[col]}"></i>${label(c).replaceAll('_',' ')}</span><a href="${c.png}">png</a>`;
    tile.dataset.kind=c.kind; tile.dataset.color=c.color||'wild'; tile.appendChild(meta); grid.appendChild(tile);
  });
}
render();
document.querySelectorAll('button[data-filter]').forEach(b => b.onclick = () => { document.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(b.dataset.filter); });
</script>
</body></html>
