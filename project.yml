# XcodeGen spec — generates WildPairs.xcodeproj on the Mac.
# Run on Mac with Xcode installed:  xcodegen generate   (or: brew install xcodegen first)
# The project depends on the local WildPairsCore Swift package at the repo root.
#
# This keeps the Xcode project reproducible from source instead of hand-edited pbxproj,
# which matters because the project is authored on Windows and built on Mac.

name: WildPairs
options:
  bundleIdPrefix: com.wildpairs
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en

packages:
  WildPairsCore:
    path: .

targets:
  WildPairs:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WildPairsApp
        excludes:
          - Info.plist   # referenced via INFOPLIST_FILE below, not copied as a resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildpairs.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WildPairsApp/Info.plist   # use our own file; do not let xcodegen manage/overwrite it
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad (Universal)
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: WildPairsCore
        product: WildPairsCore
    postBuildScripts:
      - name: "Embed build identifier (git commit + timestamp)"
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          export GIT_DIR="${SRCROOT}/.git"
          export GIT_WORK_TREE="${SRCROOT}"
          GIT_HASH=$(git rev-parse --short HEAD 2>/dev/null)
          if [ -z "${GIT_HASH}" ]; then GIT_HASH="unknown"; fi
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            GIT_HASH="${GIT_HASH}-dirty"
          fi
          BUILD_DATE=$(date "+%d %b, %H:%M")
          /usr/libexec/PlistBuddy -c "Add :GitCommitHash string ${GIT_HASH}" "${PLIST}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :GitCommitHash ${GIT_HASH}" "${PLIST}"
          /usr/libexec/PlistBuddy -c "Add :BuildTimestamp string ${BUILD_DATE}" "${PLIST}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :BuildTimestamp ${BUILD_DATE}" "${PLIST}"

  WildPairsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WildPairsUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildpairs.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: WildPairs

schemes:
  WildPairs:
    build:
      targets:
        WildPairs: all
        WildPairsUITests: [test]
    test:
      targets:
        - WildPairsUITests
